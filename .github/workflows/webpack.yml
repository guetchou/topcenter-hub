name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend production audit report
        shell: bash
        run: |
          npm audit --omit=dev --json > /tmp/frontend-audit.json || true
          node - <<'NODE'
          const report = require('/tmp/frontend-audit.json');
          console.log('FRONTEND_AUDIT_SUMMARY', JSON.stringify(report.metadata?.vulnerabilities || {}));
          for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
            if (['high', 'critical'].includes(item.severity)) {
              console.log('FRONTEND_AUDIT_ITEM', JSON.stringify({ name, severity: item.severity, isDirect: item.isDirect, fixAvailable: item.fixAvailable, via: item.via }));
            }
          }
          NODE

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Frontend tests
        run: npm test -- --run

      - name: Build frontend
        run: npm run build

      - name: Generate backend lockfile
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit backend lockfile when needed
        shell: bash
        run: |
          if git diff --quiet -- backend/package-lock.json; then
            echo "backend/package-lock.json already synchronized"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- backend/package-lock.json
            git commit -m "chore: lock backend dependencies"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Backend production audit report
        working-directory: backend
        shell: bash
        run: |
          npm audit --omit=dev --json > /tmp/backend-audit.json || true
          node - <<'NODE'
          const report = require('/tmp/backend-audit.json');
          console.log('BACKEND_AUDIT_SUMMARY', JSON.stringify(report.metadata?.vulnerabilities || {}));
          for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
            if (['high', 'critical'].includes(item.severity)) {
              console.log('BACKEND_AUDIT_ITEM', JSON.stringify({ name, severity: item.severity, isDirect: item.isDirect, fixAvailable: item.fixAvailable, via: item.via }));
            }
          }
          NODE

      - name: Backend tests
        working-directory: backend
        run: npm test -- --runInBand
