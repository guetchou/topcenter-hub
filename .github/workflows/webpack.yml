name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Synchronize lockfiles
        shell: bash
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --omit=dev
          npm install --package-lock-only --ignore-scripts --prefix backend
          if git diff --quiet -- package-lock.json backend/package-lock.json; then
            echo "lockfiles already synchronized"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- package-lock.json backend/package-lock.json
            git commit -m "chore: sync dependency lockfiles"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend production audit
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Frontend tests
        run: npm test -- --run

      - name: Build frontend
        run: npm run build

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Backend production audit
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high

      - name: Backend tests
        working-directory: backend
        run: npm test -- --runInBand
