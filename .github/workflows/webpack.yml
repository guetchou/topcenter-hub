name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Regenerate frontend lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Preserve regenerated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-package-lock
          path: package-lock.json

      - name: Verify frontend lockfile is committed
        run: git diff --exit-code -- package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Frontend tests
        run: npm test -- --run

      - name: Build frontend
        run: npm run build

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Backend tests
        working-directory: backend
        run: npm test -- --runInBand --passWithNoTests
