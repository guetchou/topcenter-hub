version: '3.8'

services:
  topcenter-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
        - VITE_POCKETBASE_URL=${VITE_POCKETBASE_URL}
    image: topcenter/app:${TAG:-latest}
    ports:
      - "${FRONTEND_PORT:-3000}:4000"
      - "${BACKEND_PORT:-4000}:4000"
    environment:
      - NODE_ENV=production
      - DB_HOST=mysql
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_PORT=3306
      - JWT_SECRET=${JWT_SECRET}
      - PORT=4000
      - FEATURE_CHATBOT=${FEATURE_CHATBOT:-true}
      - FEATURE_ANALYTICS=${FEATURE_ANALYTICS:-true}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      pocketbase:
        condition: service_healthy
    volumes:
      - ./backend/logs:/app/logs
    networks:
      - topcenter-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mysql:
    image: mysql:8.0
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/db-init:/docker-entrypoint-initdb.d
    networks:
      - topcenter-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u$$MYSQL_USER", "-p$$MYSQL_PASSWORD"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: pocketbase
    restart: unless-stopped
    ports:
      - "${POCKETBASE_PORT:-8090}:8090"
    volumes:
      - pocketbase-data:/pb_data
    networks:
      - topcenter-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  topcenter-network:
    driver: bridge

volumes:
  mysql-data:
  pocketbase-data:
